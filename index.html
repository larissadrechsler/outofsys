<html>
  <head>
    <title>OutOfSys Studio</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="#">
          <img src="logo.png" alt="OutOfSys Studio Logo" />
        </a>
      </div>

      <div class="header-icons">
        <a href="#" class="icon-link">
          <span class="material-symbols-outlined">search</span>
        </a>
        <a href="#" class="icon-link">
          <span class="material-symbols-outlined">shopping_cart</span>
        </a>

        <button class="menu-button">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </div>
    </header>

    <section class="hero-banner">
      <div class="hero-content">
        <h1 class="hero-title">
          <span>SUA</span>
          <span>PERFORMANCE</span>
          <span class="highlight-blue">ETERNIZADA</span>
        </h1>

        <p class="hero-description">
          Fotografia esportiva de alta performance.<br />
          Encontre suas fotos de eventos e campeonatos com tecnologia de
          reconhecimento facial
        </p>

        <a href="#" class="hero-button"> Encontrar minhas fotos &rarr; </a>
      </div>
    </section>
  </body>
</html>
